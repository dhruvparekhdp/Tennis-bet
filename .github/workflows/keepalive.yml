# Keeps the free Render service awake by hitting /health on a schedule.
#
# READ THIS BEFORE ENABLING — on a PRIVATE repo this will cost more than the
# free Actions quota allows:
#
#   every 14 min -> 3,188 runs/month -> 3,188 billed minutes
#   every 10 min -> 4,464 runs/month -> 4,464 billed minutes
#   GitHub Free quota on a private repo ->      2,000 minutes
#
# Every run is rounded up to a whole minute, so even the slowest cadence that
# still beats Render's 15-minute spin-down blows the quota by 60%. Public repos
# get unlimited minutes, which is the only case where this is actually free.
#
# Tennis-bet is private today, so the intended pinger is an external monitor
# (UptimeRobot's free plan does 5-minute checks with no card and no minute
# quota). This workflow exists as the fallback for if the repo goes public, and
# is inert until you deliberately switch it on.
#
# To enable:
#   1. Settings > Secrets and variables > Actions > Variables
#   2. KEEPALIVE_URL  = https://tennis-bet-izye.onrender.com/health
#   3. KEEPALIVE_ON   = true
name: keepalive

on:
  schedule:
    - cron: "*/14 * * * *"   # just inside Render's 15-minute spin-down
  workflow_dispatch:          # manual run ignores KEEPALIVE_ON, for testing

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check whether this is switched on
        id: gate
        env:
          ON: ${{ vars.KEEPALIVE_ON }}
          URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$ON" != "true" ]; then
            echo "KEEPALIVE_ON is not 'true' — skipping (see the header of this file)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$URL" ]; then
            echo "::error::KEEPALIVE_URL variable is not set."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Wake the service
        if: steps.gate.outputs.run == 'true'
        env:
          URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          # A cold start takes up to a minute, so a single short timeout would
          # report the service as down exactly when it is coming back up.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "awake (HTTP $code) on attempt $attempt"
              head -c 400 /tmp/body
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep $((attempt * 10))
          done
          echo "::error::$URL did not return 200 after 3 attempts."
          exit 1
