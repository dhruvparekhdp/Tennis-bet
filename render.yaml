services:
  - type: web
    name: tennis-bet
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render's free tier — always keep "free"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # you'll fill this in the Render dashboard
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: BANK_SIZE
        value: "10000"
      - key: MIN_CONFIDENCE
        value: "0.65"
      - key: MAX_STAKE_PCT
        value: "0.03"
      - key: SIGNAL_COOLDOWN_MINUTES
        value: "10"
      - key: SOFASCORE_POLL_INTERVAL
        value: "30"
      - key: THESPORTSDB_API_KEY
        value: "3"
      - key: DATABASE_URL
        sync: false          # set to your Neon Postgres URL in Render dashboard
      - key: INGEST_API_KEY
        sync: false          # set to a6f73f8ae0db395966528d63be617e50 in Render dashboard
      - key: ODDS_API_KEY
        sync: false          # set to your Odds API key
      - key: SPORTRADAR_API_KEY
        sync: false          # set to your Sportradar key
      - key: TWELVEDATA_API_KEY
        sync: false          # optional — commodities (Gold/Silver/Oil), leave blank to skip
      - key: CRYPTOPANIC_AUTH_TOKEN
        sync: false          # optional — crypto news/sentiment signal (now paid-only), leave blank to skip
      - key: COINGECKO_API_KEY
        sync: false          # optional — free Demo key raises crypto price polling rate limit, leave blank to use unauthenticated tier
